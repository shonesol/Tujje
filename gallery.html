<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tujje Safari Gallery</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
<style>
:root{--blue:#1565c0;--orange:#ff9800;--gold:#d4af37;--dark:#0f172a;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background:var(--dark);color:white;overflow-x:hidden;}
nav{display:flex;justify-content:space-between;align-items:center;padding:15px 25px;background:rgba(0,0,0,0.75);position:fixed;width:100%;top:0;z-index:1000;backdrop-filter:blur(12px);}
.logo{color:var(--gold);font-weight:800;font-size:22px;}
.home-btn{background:linear-gradient(45deg,var(--orange),var(--gold));padding:9px 18px;border-radius:25px;color:#000;text-decoration:none;font-weight:700;font-size:14px;}
.hero-swiper{width:100%;height:100vh;}
.hero-swiper .swiper-slide{background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;text-align:center;position:relative;}
.hero-swiper .swiper-slide::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,0.55);}
.hero-content{position:relative;z-index:2;max-width:900px;padding:0 20px;}
.hero-content h1{font-size:clamp(32px,6vw,52px);color:var(--gold);font-weight:900;margin-bottom:15px;text-shadow:0 4px 20px rgba(0,0,0,0.5);}
.hero-content p{font-size:clamp(16px,2.5vw,20px);color:#e0e0e0;}
.hero-swiper .swiper-pagination-bullet{background:white;opacity:0.5;}
.hero-swiper .swiper-pagination-bullet-active{background:var(--gold);opacity:1;}
.hero-swiper .swiper-button-next,.hero-swiper .swiper-button-prev{color:var(--gold);}
.section-title{text-align:center;margin:70px 0 30px;color:var(--orange);font-size:28px;font-weight:700;}
.section-title::after{content:"";display:block;width:60px;height:3px;background:var(--gold);margin:12px auto 0;border-radius:2px;}
.featured-swiper{width:92%;margin:0 auto 40px;padding-bottom:40px;}
.featured-swiper .swiper-slide img{width:100%;height:380px;object-fit:cover;border-radius:16px;border:3px solid var(--gold);box-shadow:0 10px 30px rgba(0,0,0,0.4);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;padding:0 25px 20px;max-width:1400px;margin:0 auto;}
.grid img,.grid video{width:100%;height:210px;object-fit:cover;border-radius:14px;cursor:pointer;border:2px solid var(--blue);transition:0.3s;background:#1e293b;}
.grid img:hover,.grid video:hover{transform:scale(1.06);border-color:var(--gold);box-shadow:0 8px 25px rgba(212,175,55,0.3);}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);justify-content:center;align-items:center;z-index:2000;backdrop-filter:blur(6px);}
.modal img,.modal video{max-width:92%;max-height:82vh;border-radius:16px;}
.close{position:absolute;top:22px;right:30px;font-size:36px;color:white;cursor:pointer;}
.nav-btn{position:absolute;top:50%;transform:translateY(-50%);font-size:48px;color:white;cursor:pointer;user-select:none;padding:10px 15px;}
.prev{left:20px;}.next{right:20px;}
footer{background:#0a1428;padding:45px 20px;text-align:center;font-size:14px;color:#94a3b8;margin-top:80px;border-top:1px solid #1e293b;}
footer .small{font-size:12px;color:#64748b;margin-top:12px;}
@media(max-width:768px){.featured-swiper .swiper-slide img{height:260px;}.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}.grid img,.grid video{height:160px;}}
</style>
</head>
<body>

<nav>
  <div class="logo">TUJJE SAFARI</div>
  <a href="index.html" class="home-btn">🏠 Home</a>
</nav>

<!-- HERO -->
<div class="swiper hero-swiper">
  <div class="swiper-wrapper" id="heroSlides"></div>
  <div class="swiper-pagination"></div>
  <div class="swiper-button-next"></div>
  <div class="swiper-button-prev"></div>
</div>

<h2 class="section-title">Featured Safari Photos</h2>
<div class="swiper featured-swiper">
  <div class="swiper-wrapper" id="featuredSlider"></div>
  <div class="swiper-pagination"></div>
</div>

<h2 class="section-title">Photo Gallery</h2>
<div class="grid" id="photo-grid"></div>

<h2 class="section-title">Safari Videos</h2>
<div class="grid" id="video-grid"></div>

<div class="modal" id="modal">
  <span class="close" onclick="closeModal()">×</span>
  <span class="nav-btn prev" onclick="prev()">❮</span>
  <span class="nav-btn next" onclick="next()">❯</span>
  <img id="modalImg">
  <video id="modalVideo" controls style="display:none;"></video>
</div>

<footer>
  <p>&copy; 2026 Tujje Safari. All rights reserved.</p>
  <p>Made with ❤️ for Uganda safaris</p>
  <p class="small">Photos → tujje/gallery/photos &nbsp;|&nbsp; Videos → tujje/gallery/videos &nbsp;|&nbsp; Users can only view</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
  const CLOUD_NAME = "ziudh5iv";   // ← change this
const UPLOAD_PRESET = "tujje_gallery";
  const ADMIN_PASSWORD = "tujje2026";
  let items = [];
  let index = 0;
  const modal = document.getElementById("modal");
  const modalImg = document.getElementById("modalImg");
  const modalVideo = document.getElementById("modalVideo");

  function loadGallery() {
    // Photos and videos are stored separately
    const photos = JSON.parse(localStorage.getItem("tujje_photos") || "[]");
    const videos = JSON.parse(localStorage.getItem("tujje_videos") || "[]");

    // ===== HERO SLIDES (from photos only) =====
    const heroWrapper = document.getElementById("heroSlides");
    const heroPhotos = photos.slice(0, 6);
    const titles = [
      {h:"Explore Uganda With Tujje Safari", p:"Luxury safaris, wildlife & unforgettable adventures"},
      {h:"Gorilla Trekking Adventures", p:"Meet the gentle giants of Bwindi"},
      {h:"Big Five Safari Experience", p:"Lions, elephants, buffalo, leopards & rhinos"},
      {h:"Wildlife Up Close", p:"Unforgettable encounters in Uganda’s parks"},
      {h:"Scenic Landscapes", p:"From the Nile to the Mountains of the Moon"},
      {h:"Luxury Safari Camps", p:"Comfort and adventure in the wild"}
    ];

    if (heroPhotos.length === 0) {
      heroWrapper.innerHTML = `
        <div class="swiper-slide" style="background-image:url('https://res.cloudinary.com/${CLOUD_NAME}/image/upload/f_auto,q_auto/tujje/gallery/photos/placeholder')">
          <div class="hero-content"><h1>Explore Uganda With Tujje Safari</h1><p>Luxury safaris & wildlife adventures</p></div>
        </div>`;
    } else {
      heroPhotos.forEach((p, i) => {
        const t = titles[i] || titles[0];
        heroWrapper.innerHTML += `
          <div class="swiper-slide" style="background-image:url('${p.url}')">
            <div class="hero-content"><h1>${t.h}</h1><p>${t.p}</p></div>
          </div>`;
      });
    }

    // ===== FEATURED (photos only) =====
    const featured = document.getElementById("featuredSlider");
    photos.slice(0, 8).forEach(p => {
      featured.innerHTML += `<div class="swiper-slide"><img src="${p.url}" alt="Safari"></div>`;
    });

    // ===== PHOTO GRID (only photos) =====
    const photoGrid = document.getElementById("photo-grid");
    photos.forEach(p => {
      const img = document.createElement("img");
      img.src = p.url;
      img.dataset.type = "photo";
      img.dataset.url = p.url;
      photoGrid.appendChild(img);
      items.push(img);
    });

    // ===== VIDEO GRID (only videos) =====
    const videoGrid = document.getElementById("video-grid");
    videos.forEach(v => {
      const vid = document.createElement("video");
      vid.src = v.url;
      vid.muted = true;
      vid.loop = true;
      vid.playsInline = true;
      vid.autoplay = true;
      vid.dataset.type = "video";
      vid.dataset.url = v.url;
      videoGrid.appendChild(vid);
      items.push(vid);
      vid.play().catch(()=>{});
    });

    // Click to open modal
    items.forEach((el, i) => {
      el.addEventListener("click", () => {
        index = i;
        openModal(el);
      });
    });

    // Init swipers
    new Swiper(".hero-swiper", {
      loop: true, effect: "fade", speed: 1000,
      autoplay: { delay: 4500, disableOnInteraction: false },
      pagination: { el: ".hero-swiper .swiper-pagination", clickable: true },
      navigation: { nextEl: ".hero-swiper .swiper-button-next", prevEl: ".hero-swiper .swiper-button-prev" }
    });

    new Swiper(".featured-swiper", {
      loop: true, slidesPerView: 1.2, spaceBetween: 18, autoplay: { delay: 2800 },
      breakpoints: { 640: { slidesPerView: 2.2 }, 1024: { slidesPerView: 3.2 } },
      pagination: { el: ".featured-swiper .swiper-pagination", clickable: true }
    });
  }

  function openModal(el) {
    modal.style.display = "flex";
    if (el.dataset.type === "photo" || el.tagName === "IMG") {
      modalImg.style.display = "block";
      modalVideo.style.display = "none";
      modalImg.src = el.dataset.url || el.src;
    } else {
      modalImg.style.display = "none";
      modalVideo.style.display = "block";
      modalVideo.src = el.dataset.url || el.src;
      modalVideo.play();
    }
  }
  function closeModal() { modal.style.display = "none"; modalVideo.pause(); }
  function next() { index = (index + 1) % items.length; openModal(items[index]); }
  function prev() { index = (index - 1 + items.length) % items.length; openModal(items[index]); }

  modal.addEventListener("click", e => { if (e.target === modal) closeModal(); });
  document.addEventListener("keydown", e => {
    if (modal.style.display === "flex") {
      if (e.key === "ArrowRight") next();
      if (e.key === "ArrowLeft") prev();
      if (e.key === "Escape") closeModal();
    }
  });

  loadGallery();
</script>
</body>
</html>
