<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tujje Safari – Admin Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #d4af37;
      --orange: #ff9800;
      --dark: #0f172a;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body { background: var(--dark); color: white; padding: 30px 20px; max-width: 1100px; margin: 0 auto; }
    h1 { color: var(--gold); margin-bottom: 10px; }
    .subtitle { color: #94a3b8; margin-bottom: 30px; }
    .card {
      background: #1e293b;
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 30px;
      border: 1px solid #334155;
    }
    .card h2 { color: var(--orange); margin-bottom: 15px; font-size: 20px; }
    input[type="file"], button, select {
      width: 100%;
      padding: 12px 16px;
      margin: 8px 0;
      border-radius: 10px;
      border: none;
      font-size: 15px;
    }
    button {
      background: linear-gradient(45deg, var(--orange), var(--gold));
      color: #000;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s;
    }
    button:hover { transform: scale(1.02); }
    button.danger {
      background: #dc2626;
      color: white;
    }
    .msg {
      margin-top: 12px;
      padding: 12px;
      border-radius: 10px;
      display: none;
    }
    .msg.success { background: #166534; display: block; }
    .msg.error { background: #7f1d1d; display: block; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }
    .item {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #334155;
    }
    .item img, .item video {
      width: 100%;
      height: 160px;
      object-fit: cover;
      display: block;
    }
    .item .delete-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: #dc2626;
      color: white;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .tab {
      padding: 10px 20px;
      background: #334155;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    .tab.active {
      background: var(--orange);
      color: #000;
    }
  </style>
</head>
<body>

  <h1>Tujje Safari – Admin Panel</h1>
  <p class="subtitle">Upload & manage photos and videos (stored separately on Cloudinary)</p>

  <!-- UPLOAD SECTION -->
  <div class="card">
    <h2>Upload New Media</h2>

    <label>Choose type</label>
    <select id="mediaType">
      <option value="image">Photo</option>
      <option value="video">Video</option>
    </select>

    <input type="file" id="fileInput" accept="image/*,video/*">

    <button onclick="uploadMedia()">Upload to Cloudinary</button>
    <div id="uploadMsg" class="msg"></div>
  </div>

  <!-- MANAGE SECTION -->
  <div class="card">
    <h2>Manage Existing Media</h2>

    <div class="tabs">
      <div class="tab active" onclick="showTab('photos')">Photos</div>
      <div class="tab" onclick="showTab('videos')">Videos</div>
    </div>

    <div id="photosTab">
      <div class="grid" id="adminPhotoGrid"></div>
    </div>

    <div id="videosTab" style="display:none;">
      <div class="grid" id="adminVideoGrid"></div>
    </div>
  </div>

  <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
  <script>
    // ========== YOUR CLOUDINARY SETTINGS ==========
    const CLOUD_NAME = "ziudh5iv";          // ← CHANGE THIS
    const UPLOAD_PRESET = "tujje_gallery";         // from your screenshot
    // =============================================

    // Simple password protection (change this!)
    const ADMIN_PASSWORD = "tujje2026";            // ← CHANGE THIS to a strong password

    // Check password on load
    if (sessionStorage.getItem("tujje_admin") !== "yes") {
      const pass = prompt("Enter Admin Password:");
      if (pass !== ADMIN_PASSWORD) {
        alert("Wrong password. Access denied.");
        window.location.href = "index.html";
      } else {
        sessionStorage.setItem("tujje_admin", "yes");
      }
    }

    // ========== UPLOAD ==========
    async function uploadMedia() {
      const fileInput = document.getElementById("fileInput");
      const type = document.getElementById("mediaType").value;
      const msg = document.getElementById("uploadMsg");

      if (!fileInput.files[0]) {
        msg.className = "msg error";
        msg.textContent = "Please select a file first";
        return;
      }

      const file = fileInput.files[0];
      const folder = type === "image" ? "tujje/gallery/photos" : "tujje/gallery/videos";

      const formData = new FormData();
      formData.append("file", file);
      formData.append("upload_preset", UPLOAD_PRESET);
      formData.append("folder", folder);

      msg.className = "msg";
      msg.style.display = "block";
      msg.style.background = "#1e40af";
      msg.textContent = "Uploading... please wait";

      try {
        const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/${type}/upload`, {
          method: "POST",
          body: formData
        });

        const data = await res.json();

        if (data.secure_url) {
          msg.className = "msg success";
          msg.innerHTML = `✅ Uploaded successfully!<br>
            <small>${data.secure_url}</small>`;
          fileInput.value = "";
          loadAdminMedia(); // refresh list
        } else {
          throw new Error(data.error?.message || "Upload failed");
        }
      } catch (err) {
        msg.className = "msg error";
        msg.textContent = "Error: " + err.message;
      }
    }

    // ========== LOAD MEDIA FOR ADMIN ==========
    async function loadAdminMedia() {
      // Because we use unsigned preset, we cannot list resources from frontend securely.
      // Solution: we keep a simple list in localStorage + also try to fetch known ones.
      // For production you should add a tiny backend. For now this works well.

      const photos = JSON.parse(localStorage.getItem("tujje_photos") || "[]");
      const videos = JSON.parse(localStorage.getItem("tujje_videos") || "[]");

      renderAdminGrid("adminPhotoGrid", photos, "image");
      renderAdminGrid("adminVideoGrid", videos, "video");
    }

    function renderAdminGrid(gridId, items, resourceType) {
      const grid = document.getElementById(gridId);
      grid.innerHTML = "";

      if (items.length === 0) {
        grid.innerHTML = `<p style="color:#94a3b8">No ${resourceType}s yet. Upload some!</p>`;
        return;
      }

      items.forEach((item, idx) => {
        const div = document.createElement("div");
        div.className = "item";

        if (resourceType === "image") {
          div.innerHTML = `
            <img src="${item.url}" alt="photo">
            <button class="delete-btn" onclick="deleteMedia('${item.public_id}', '${resourceType}', ${idx})">×</button>
          `;
        } else {
          div.innerHTML = `
            <video src="${item.url}" muted></video>
            <button class="delete-btn" onclick="deleteMedia('${item.public_id}', '${resourceType}', ${idx})">×</button>
          `;
        }
        grid.appendChild(div);
      });
    }

    // ========== DELETE ==========
    async function deleteMedia(publicId, resourceType, index) {
      if (!confirm("Are you sure you want to delete this " + resourceType + "?")) return;

      // Note: Deleting requires API secret → cannot be done from frontend securely.
      // We remove it from our local list for now.
      // Real deletion must be done from Cloudinary Media Library or with a backend.

      if (resourceType === "image") {
        let photos = JSON.parse(localStorage.getItem("tujje_photos") || "[]");
        photos.splice(index, 1);
        localStorage.setItem("tujje_photos", JSON.stringify(photos));
      } else {
        let videos = JSON.parse(localStorage.getItem("tujje_videos") || "[]");
        videos.splice(index, 1);
        localStorage.setItem("tujje_videos", JSON.stringify(videos));
      }

      alert("Removed from gallery list.\n\nTo permanently delete from Cloudinary, go to Media Library and delete it there (or we can add a backend later).");
      loadAdminMedia();
    }

    // Save uploaded item to localStorage so the public page can read it
    // We intercept the successful upload
    const originalUpload = window.uploadMedia;
    window.uploadMedia = async function() {
      const fileInput = document.getElementById("fileInput");
      const type = document.getElementById("mediaType").value;
      const msg = document.getElementById("uploadMsg");

      if (!fileInput.files[0]) {
        msg.className = "msg error";
        msg.textContent = "Please select a file first";
        return;
      }

      const file = fileInput.files[0];
      const folder = type === "image" ? "tujje/gallery/photos" : "tujje/gallery/videos";

      const formData = new FormData();
      formData.append("file", file);
      formData.append("upload_preset", UPLOAD_PRESET);
      formData.append("folder", folder);

      msg.className = "msg";
      msg.style.display = "block";
      msg.style.background = "#1e40af";
      msg.textContent = "Uploading... please wait";

      try {
        const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/${type}/upload`, {
          method: "POST",
          body: formData
        });

        const data = await res.json();

        if (data.secure_url) {
          // Save to localStorage so public page can display it
          const item = {
            url: data.secure_url,
            public_id: data.public_id,
            created_at: data.created_at
          };

          if (type === "image") {
            const photos = JSON.parse(localStorage.getItem("tujje_photos") || "[]");
            photos.unshift(item);
            localStorage.setItem("tujje_photos", JSON.stringify(photos));
          } else {
            const videos = JSON.parse(localStorage.getItem("tujje_videos") || "[]");
            videos.unshift(item);
            localStorage.setItem("tujje_videos", JSON.stringify(videos));
          }

          msg.className = "msg success";
          msg.innerHTML = `✅ Uploaded successfully!<br><small>${data.secure_url}</small>`;
          fileInput.value = "";
          loadAdminMedia();
        } else {
          throw new Error(data.error?.message || "Upload failed");
        }
      } catch (err) {
        msg.className = "msg error";
        msg.textContent = "Error: " + err.message;
      }
    };

    function showTab(tab) {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      event.target.classList.add("active");

      document.getElementById("photosTab").style.display = tab === "photos" ? "block" : "none";
      document.getElementById("videosTab").style.display = tab === "videos" ? "block" : "none";
    }

    // Initial load
    loadAdminMedia();
  </script>
</body>
</html>
